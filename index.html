<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UCI Social Media Dashboard — 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0b;--bgc:#111114;--bg2:#17171c;--bg3:#1d1d23;
  --tx:#fafafa;--txm:#71717a;--txd:#a1a1aa;
  --bd:#27272a;--bdH:#3f3f46;
  --ac:#facc15;--acH:#fde047;--acD:#eab308;
  --num:'JetBrains Mono',ui-monospace,monospace;
}
body.light{
  --bg:#fafafa;--bgc:#fff;--bg2:#f4f4f5;--bg3:#e4e4e7;
  --tx:#09090b;--txm:#71717a;--txd:#52525b;
  --bd:#e4e4e7;--bdH:#d4d4d8;
  --ac:#eab308;--acH:#ca8a04;--acD:#a16207;
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);transition:background .3s,color .3s;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
button{font-family:inherit;cursor:pointer;transition:all .15s;outline:none;letter-spacing:.01em}

/* === HEADER === */
.hdr{padding:18px 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd);flex-wrap:wrap;gap:14px;background:var(--bgc)}
.brand{display:flex;align-items:center;gap:14px}
.brand-mark{width:36px;height:36px;border-radius:2px;background:var(--ac);display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:16px;letter-spacing:-1px;font-family:var(--num)}
.brand-txt{display:flex;flex-direction:column;line-height:1.1}
.brand-name{font-size:15px;font-weight:800;letter-spacing:-.02em;text-transform:uppercase}
.brand-sub{font-size:9px;font-weight:500;color:var(--txm);letter-spacing:.18em;text-transform:uppercase;margin-top:2px}
.ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* === BUTTONS === */
.btn{padding:8px 14px;font-size:11px;font-weight:600;border:1px solid var(--bd);background:transparent;color:var(--tx);text-transform:uppercase;letter-spacing:.06em;border-radius:2px}
.btn:hover{border-color:var(--bdH);background:var(--bg2)}
.btn.on{border-color:var(--ac);background:var(--ac);color:#000;font-weight:700}
.btn-sm{padding:6px 11px;font-size:10px}
.btn-xs{padding:4px 9px;font-size:9px}
.btn-primary{background:var(--ac);color:#000;border-color:var(--ac);font-weight:700}
.btn-primary:hover{background:var(--acH);border-color:var(--acH)}
.btn-icon{display:inline-flex;align-items:center;gap:6px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:2px;overflow:hidden}
.seg .btn{border:none;border-right:1px solid var(--bd);border-radius:0}
.seg .btn:last-child{border-right:none}
.seg .btn.on{border-color:var(--ac)}

/* === STATUS === */
.status-bar{padding:6px 32px;font-size:10px;background:var(--bgc);border-bottom:1px solid var(--bd);color:var(--txm);text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:8px}
.status-bar::before{content:"";width:6px;height:6px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e}

/* === TABS === */
.tabs{padding:0 32px;border-bottom:1px solid var(--bd);display:flex;background:var(--bgc)}
.tab{padding:14px 22px;font-size:11px;font-weight:600;background:transparent;border:none;color:var(--txm);border-bottom:2px solid transparent;text-transform:uppercase;letter-spacing:.1em}
.tab:hover{color:var(--tx)}
.tab.on{color:var(--tx);border-bottom-color:var(--ac)}

/* === BAR / FILTERS === */
.bar{padding:16px 32px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;background:var(--bg);border-bottom:1px solid var(--bd)}
.bar-l,.bar-r{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bar-label{font-size:9px;color:var(--txm);text-transform:uppercase;letter-spacing:.12em;font-weight:600;margin-right:4px}

/* === CONTENT === */
.content{padding:24px 32px}

/* === TABLE === */
.tbl-wrap{overflow-x:auto;border:1px solid var(--bd);background:var(--bgc)}
table{width:100%;border-collapse:collapse;font-size:12px}
thead tr{background:var(--bg2);border-bottom:1px solid var(--bd)}
th{padding:12px 14px;font-size:9px;font-weight:700;color:var(--txm);text-transform:uppercase;letter-spacing:.12em;border-bottom:1px solid var(--bd)}
th:first-child{text-align:left;position:sticky;left:0;background:var(--bg2);z-index:2;min-width:280px;border-right:1px solid var(--bd)}
th:not(:first-child){text-align:right}
td{padding:11px 14px;text-align:right;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--bd);font-family:var(--num);font-size:12px;font-weight:500;color:var(--txd)}
td:first-child{position:sticky;left:0;background:var(--bgc);z-index:1;text-align:left;font-family:'Inter',sans-serif;border-right:1px solid var(--bd)}
tbody tr:hover td{background:var(--bg2)}
tbody tr:hover td:first-child{background:var(--bg3)}
tbody tr:last-child td{border-bottom:none}
.ent{display:flex;align-items:center;gap:10px}
.rank{font-size:10px;color:var(--txm);width:22px;text-align:right;font-weight:700;font-family:var(--num)}
.cbar{width:3px;height:24px;flex-shrink:0}
.flag{font-size:14px;display:flex;align-items:center}
.ename{font-weight:600;font-size:12px;white-space:nowrap;color:var(--tx);letter-spacing:-.005em}
.badge{display:inline-block;font-size:8px;font-weight:700;padding:3px 7px;color:#fff;margin-left:6px;text-transform:uppercase;letter-spacing:.08em;border-radius:1px}
.empty{color:var(--bd)}

/* === CHART === */
.chart-box{background:var(--bgc);border:1px solid var(--bd);padding:24px}
.chart-title{font-size:11px;font-weight:700;margin-bottom:20px;text-transform:uppercase;letter-spacing:.12em;color:var(--txm);display:flex;align-items:center;gap:10px}
.chart-title::before{content:"";width:3px;height:14px;background:var(--ac)}
.chart-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.chart-name{font-size:11px;width:180px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--tx)}
.chart-track{flex:1;height:26px;background:var(--bg2);overflow:hidden;border:1px solid var(--bd)}
.chart-fill{height:100%;display:flex;align-items:center;justify-content:flex-end;padding-right:10px;transition:width .8s cubic-bezier(.16,1,.3,1)}
.chart-val{font-size:10px;font-weight:700;color:#fff;font-family:var(--num);text-shadow:0 1px 2px rgba(0,0,0,.6)}
.chart-val-out{font-size:10px;color:var(--txd);font-weight:700;font-family:var(--num);margin-left:4px}

/* === LEGEND === */
.legend{margin-top:16px;padding:14px 18px;border:1px solid var(--bd);background:var(--bgc);font-size:9px;color:var(--txm);display:flex;flex-wrap:wrap;gap:18px;align-items:center;text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.leg-i{display:flex;align-items:center;gap:6px}
.leg-d{width:10px;height:10px;display:inline-block}

/* === IMPORT ZONE === */
.import-zone{border:1px dashed var(--bd);padding:48px 24px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:20px;background:var(--bgc)}
.import-zone:hover{border-color:var(--ac);background:var(--bg2)}
.import-zone-icon{width:48px;height:48px;margin:0 auto 14px;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--ac)}
.import-zone-title{font-size:13px;font-weight:700;margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em}
.import-zone-sub{font-size:10px;color:var(--txm);letter-spacing:.04em}

/* === MODAL === */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.75);z-index:100;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.modal{background:var(--bgc);border:1px solid var(--bd);padding:32px;width:460px;max-width:92vw;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal-title{font-size:14px;font-weight:800;margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:10px}
.modal-title::before{content:"";width:3px;height:16px;background:var(--ac)}
.modal-sub{font-size:11px;color:var(--txm);margin-bottom:24px;line-height:1.5}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal-btn{display:flex;align-items:center;gap:12px;padding:16px 14px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;flex-wrap:wrap;text-transform:uppercase;letter-spacing:.05em}
.modal-btn-date{width:100%;font-size:9px;font-weight:500;margin-top:4px;text-transform:none;letter-spacing:0;font-family:var(--num)}
.modal-btn:hover:not(:disabled){border-color:var(--ac);background:var(--bg3)}
.modal-btn:disabled{opacity:.4;cursor:not-allowed}
.modal-btn .mbico{width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-close{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--txm);font-size:18px;cursor:pointer;padding:6px 10px;line-height:1}
.modal-close:hover{color:var(--tx)}
.modal-status{margin-top:18px;padding:14px;font-size:10px;line-height:1.7;max-height:200px;overflow-y:auto;background:var(--bg);border:1px solid var(--bd);display:none;font-family:var(--num)}
.modal-status.show{display:block}
.modal-progress{width:100%;height:2px;background:var(--bd);margin-top:14px;overflow:hidden;display:none}
.modal-progress.show{display:block}
.modal-progress-bar{height:100%;background:var(--ac);transition:width .3s;width:0}
.modal input{font-family:var(--num)}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.collecting{animation:pulse 1.5s infinite}

/* === SCROLLBAR === */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bd);border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--bdH)}
</style>
</head>

<div id="app"></div>
<div id="modal-container"></div>

function fN(n){return n==null?"—":n.toLocaleString("fr-FR")}
function gVal(md,s){
  if(!md)return null;
  if(s==="Overall"){const t=(md.ig||0)+(md.fb||0)+(md.x||0)+(md.tk||0);return t>0?t:null}
  const mp={Instagram:"ig",Facebook:"fb",X:"x",TikTok:"tk"};
  return md[mp[s]]||null;
}

let S={dk:true,gen:"men",tab:"courses",soc:"Overall",vw:"table",fil:"all",dt:{},imports:[],lastUpdate:{ig:null,fb:null,x:null,tk:null}};

function loadFromLS(){
  try{const d=localStorage.getItem("uci-dash-v2");if(d)S.dt=JSON.parse(d)}catch{}
  try{const u=localStorage.getItem("uci-dash-lastup");if(u)S.lastUpdate=JSON.parse(u)}catch{}
  // Auto-detect last update from existing data if not yet tracked
  if(!S.lastUpdate.ig||!S.lastUpdate.fb||!S.lastUpdate.x){
    const months=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
    let latestIG=null,latestFB=null,latestX=null;
    for(const key of Object.keys(S.dt)){
      for(let m=months.length-1;m>=0;m--){
        const mk=months[m];
        const cell=S.dt[key]?.[mk];
        if(!cell)continue;
        if(cell.ig!=null&&(!latestIG||m>months.indexOf(latestIG)))latestIG=mk;
        if(cell.fb!=null&&(!latestFB||m>months.indexOf(latestFB)))latestFB=mk;
        if(cell.x!=null&&(!latestX||m>months.indexOf(latestX)))latestX=mk;
      }
    }
    const yr=new Date().getFullYear();
    if(latestIG&&!S.lastUpdate.ig){const mi=months.indexOf(latestIG);S.lastUpdate.ig=yr+"-"+String(mi+1).padStart(2,"0")+"-01"}
    if(latestFB&&!S.lastUpdate.fb){const mi=months.indexOf(latestFB);S.lastUpdate.fb=yr+"-"+String(mi+1).padStart(2,"0")+"-01"}
    if(latestX&&!S.lastUpdate.x){const mi=months.indexOf(latestX);S.lastUpdate.x=yr+"-"+String(mi+1).padStart(2,"0")+"-01"}
    saveToLS();
  }
}
function saveToLS(){
  try{localStorage.setItem("uci-dash-v2",JSON.stringify(S.dt))}catch{}
  try{localStorage.setItem("uci-dash-lastup",JSON.stringify(S.lastUpdate))}catch{}
}

function importJSON(json){
  const mk=json.month;
  if(!mk)return;
  for(const[key,entry] of Object.entries(json.data)){
    // Match by ig_username to dashboard entities
    const ig=entry.ig_username;
    const count=entry.ig_followers;
    if(!ig||count==null)continue;
    // Find all entities with this ig username
    for(const list of[TM,TW,RM,RW]){
      for(const e of list){
        if(e.ig===ig){
          const k=e.n+"|"+(e.cl||e.co);
          if(!S.dt[k])S.dt[k]={};
          if(!S.dt[k][mk])S.dt[k][mk]={};
          S.dt[k][mk].ig=count;
        }
      }
    }
  }
  S.imports.push(json.date+" ("+json.stats.success+" comptes)");
  saveToLS();
}

function getItems(){
  const src=S.tab==="courses"?(S.gen==="men"?RM:RW):(S.gen==="men"?TM:TW);
  let ls=src.map(e=>({...e,_k:e.n+"|"+(e.cl||e.co),_m:S.dt[e.n+"|"+(e.cl||e.co)]||{}}));
  if(S.tab==="courses"){
    if(S.fil==="gt")ls=ls.filter(r=>rbdg(r.n,r.cl).l==="Grand Tour");
    if(S.fil==="stage")ls=ls.filter(r=>r.cl&&r.cl.startsWith("2."));
    if(S.fil==="oneday")ls=ls.filter(r=>r.cl&&r.cl.startsWith("1."));
  }
  ls.sort((a,b)=>{for(const mk of MKS){const va=gVal(a._m[mk],S.soc)||0,vb=gVal(b._m[mk],S.soc)||0;if(va||vb)return vb-va}return 0});
  return ls;
}

function getCM(items){
  if(S.tab==="equipes")return S.gen==="men"?TCM:TCW;
  const m={};items.forEach(r=>m[r.n]=rcol(r.n,r.cl));return m;
}

function getApifyToken(){return localStorage.getItem("uci-dash-apify-token")||""}
function setApifyToken(t){localStorage.setItem("uci-dash-apify-token",t)}
let _collecting=false;

// Fetch with retry (handles transient network errors)
async function fetchRetry(url,opts={},retries=3){
  for(let i=0;i<retries;i++){
    try{
      const r=await fetch(url,opts);
      return r;
    }catch(e){
      if(i===retries-1)throw e;
      modalLog(`⚠️ Erreur réseau, nouvelle tentative (${i+2}/${retries})...`,"warn");
      await new Promise(r=>setTimeout(r,2000*(i+1)));
    }
  }
}

async function collectInstagram(){
  if(_collecting)return;
  const token=getApifyToken();
  if(!token){
    modalLog("❌ Clé API Apify manquante. Saisissez-la ci-dessus.","err");
    document.getElementById("apify-token-input")?.focus();
    return;
  }
  _collecting=true;
  const btn=document.getElementById("btn-ig");
  if(btn){btn.disabled=true;btn.classList.add("collecting")}
  const st=document.getElementById("modal-status");
  if(st){st.innerHTML="";st.classList.add("show")}

  const usernames=getAllIgUsernames();
  modalLog(`🚀 Lancement de la collecte Instagram — ${usernames.length} comptes...`);
  setProgress(5);

  try{
    // Step 1: Start the Apify actor run
    modalLog("⏳ Démarrage de l'actor Apify...");
    const startResp=await fetchRetry(
      `https://api.apify.com/v2/acts/apify~instagram-followers-count-scraper/runs?token=${token}`,
      {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({usernames:usernames.map(u=>`https://www.instagram.com/${u}/`)})}
    );
    if(!startResp.ok){
      const errText=await startResp.text();
      throw new Error(`Erreur Apify (${startResp.status}): ${errText}`);
    }
    const runData=await startResp.json();
    const runId=runData.data.id;
    modalLog(`✅ Actor lancé (run: ${runId.substring(0,8)}...)`);
    setProgress(15);

    // Step 2: Poll for completion
    modalLog("⏳ Collecte en cours...");
    let status="RUNNING";
    let polls=0;
    const maxPolls=120; // max ~10 min
    while(status==="RUNNING"||status==="READY"){
      await new Promise(r=>setTimeout(r,5000));
      polls++;
      if(polls>maxPolls)throw new Error("Timeout — la collecte prend trop de temps");
      const pollResp=await fetchRetry(`https://api.apify.com/v2/actor-runs/${runId}?token=${token}`);
      if(!pollResp.ok)throw new Error(`Erreur polling (${pollResp.status})`);
      const pollData=await pollResp.json();
      status=pollData.data.status;
      const pct=Math.min(15+polls*1.5,85);
      setProgress(pct);
      if(polls%6===0)modalLog(`⏳ En cours... (${Math.round(pct)}%)`);
    }

    if(status!=="SUCCEEDED"){
      throw new Error(`L'actor a terminé avec le statut: ${status}`);
    }
    modalLog("✅ Collecte terminée !");
    setProgress(90);

    // Step 3: Get dataset results
    modalLog("📥 Récupération des résultats...");
    const dataResp=await fetchRetry(
      `https://api.apify.com/v2/actor-runs/${runId}/dataset/items?token=${token}`
    );
    if(!dataResp.ok)throw new Error(`Erreur récupération données (${dataResp.status})`);
    const results=await dataResp.json();
    setProgress(95);

    // Step 4: Import into dashboard
    const now=new Date();
    const monthKey=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"][now.getMonth()];
    let ok=0,fail=0;

    // Debug: log first item to see actual field names
    if(results.length>0){
      const sample=results[0];
      const keys=Object.keys(sample);
      modalLog(`📋 Format reçu (${results.length} items) — champs: ${keys.join(", ")}`);
      modalLog(`📋 Exemple: ${JSON.stringify(sample).substring(0,200)}...`);
    }

    // Build a lookup map: lowercase ig username -> list of entities
    const igMap={};
    for(const list of[TM,TW,RM,RW]){
      for(const e of list){
        if(e.ig){
          const key=e.ig.toLowerCase();
          if(!igMap[key])igMap[key]=[];
          igMap[key].push(e);
        }
      }
    }

    for(const item of results){
      // Extract username — Apify returns "userName" (camelCase)
      let username=item.userName||item.username||item.profileName||item.handle||item.name||"";
      // If it's a URL, extract username from it
      if(!username&&(item.userUrl||item.inputUrl||item.url)){
        username=(item.userUrl||item.inputUrl||item.url);
      }
      // Clean: remove URL parts, @, trailing slashes
      if(typeof username==="string"){
        username=username.replace(/https?:\/\/(www\.)?instagram\.com\//gi,"").replace(/\/.*$/,"").replace(/^@/,"").trim().toLowerCase();
      }

      // Try every possible field name for follower count
      let followers=null;
      for(const f of["followersCount","followers","followerCount","edge_followed_by","subscribersCount","followedBy","follower_count"]){
        if(item[f]!=null){
          followers=typeof item[f]==="object"?item[f].count:item[f];
          break;
        }
      }

      if(!username){fail++;continue}

      const matched=igMap[username];
      if(matched&&followers!=null){
        for(const e of matched){
          const k=e.n+"|"+(e.cl||e.co);
          if(!S.dt[k])S.dt[k]={};
          if(!S.dt[k][monthKey])S.dt[k][monthKey]={};
          S.dt[k][monthKey].ig=followers;
          ok++;
        }
      } else if(followers==null){
        fail++;
        if(results.length<=20)modalLog(`⚠️ @${username}: pas de followers trouvé`,"warn");
      } else {
        fail++;
        if(results.length<=20)modalLog(`⚠️ @${username}: non trouvé dans le dashboard`,"warn");
      }
    }

    saveToLS();
    setProgress(100);
    modalLog(`🏁 Import terminé : ${ok} entrées mises à jour, ${fail} échecs`,"ok");
    S.lastUpdate.ig=now.toISOString().split("T")[0];
    S.imports.push(now.toISOString().split("T")[0]+" (Instagram via Apify — "+ok+" comptes)");
    render();

  }catch(err){
    modalLog(`❌ Erreur: ${err.message}`,"err");
  }finally{
    _collecting=false;
    if(btn){btn.disabled=false;btn.classList.remove("collecting")}
  }
}

    );

    const now=new Date();
    const monthKey=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"][now.getMonth()];
    let ok=0,fail=0;

    if(results.length>0){
      const sample=results[0];
      modalLog(`📋 Format reçu (${results.length} items) — champs: ${Object.keys(sample).join(", ")}`);
      // Deep debug: show structure of key nested objects
      if(sample.core) modalLog(`🔍 core: ${JSON.stringify(sample.core).substring(0,400)}`);
      if(sample.relationship_counts) modalLog(`🔍 relationship_counts: ${JSON.stringify(sample.relationship_counts).substring(0,400)}`);

          if(!xMap[key])xMap[key]=[];
          xMap[key].push(e);
        }
      }
    }

    // Deep search helper: find a value by key name recursively (max depth 5)
    function deepFind(obj,key,depth=0){
      if(!obj||typeof obj!=="object"||depth>5)return undefined;
      if(obj[key]!==undefined)return obj[key];
      for(const k of Object.keys(obj)){
        const v=deepFind(obj[k],key,depth+1);
        if(v!==undefined)return v;
      }
      return undefined;
    }

    for(const item of results){

      if(!handle){
        const core=item.core||{};
        handle=core.screen_name||core.username||core.userName||"";
        // Twitter API nests under core.user_results.result.legacy
        if(!handle&&core.user_results?.result?.legacy){
          handle=core.user_results.result.legacy.screen_name||"";
        }
      }
      // Nested in properties
      if(!handle){
        const props=item.properties||{};
        handle=props.screen_name||props.username||props.userName||"";
      }
      // Deep recursive search as last resort
      if(!handle){
        handle=deepFind(item,"screen_name")||deepFind(item,"username")||"";
      }
      if(!handle){
        const url=item.url||item.profileUrl||item.inputUrl||"";

      }
      // Deep search
      if(followers==null){
        const fc=deepFind(item,"followers_count");
        if(typeof fc==="number") followers=fc;
      }
      if(followers==null){
        const fc=deepFind(item,"normal_followers_count");
        if(typeof fc==="number") followers=fc;
      }

      if(!handle){fail++;continue}

      const matched=xMap[handle];
      if(matched&&followers!=null){
        for(const e of matched){
          const k=e.n+"|"+(e.cl||e.co);
          if(!S.dt[k])S.dt[k]={};

    setProgress(100);
    modalLog(`🏁 Import terminé : ${ok} entrées mises à jour, ${fail} échecs`,"ok");
    S.lastUpdate.x=now.toISOString().split("T")[0];
    S.imports.push(now.toISOString().split("T")[0]+" (X via Apify — "+ok+" comptes)");
    render();

  }catch(err){
    modalLog(`❌ Erreur: ${err.message}`,"err");
  }finally{
    _collecting=false;
    if(btn){btn.disabled=false;btn.classList.remove("collecting")}
  }
}

function fmtLastUpdate(dateStr){
  if(!dateStr)return '<span style="color:var(--txm)">— jamais actualisé</span>';
  const d=new Date(dateStr);
  const mois=["janv.","fév.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
  const today=new Date();
  const sameMonth=d.getMonth()===today.getMonth()&&d.getFullYear()===today.getFullYear();
  const label=d.getDate()+" "+mois[d.getMonth()]+" "+d.getFullYear();
  const dot='<span style="display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:middle;';
  if(sameMonth) return dot+'background:#22c55e"></span><span style="color:#22c55e">À jour · '+label+'</span>';
  return dot+'background:#f59e0b"></span><span style="color:#f59e0b">'+label+'</span>';
}
