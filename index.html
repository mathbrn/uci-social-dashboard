<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UCI Social Media Dashboard — 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#fafafa;--bgc:#fff;--bg2:#f4f4f5;--bg3:#e4e4e7;
  --tx:#09090b;--txm:#71717a;--txd:#52525b;
  --bd:#e4e4e7;--bdH:#d4d4d8;
  --ac:#dc2626;--acH:#b91c1c;--acD:#991b1b;
  --num:'JetBrains Mono',ui-monospace,monospace;
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
button{font-family:inherit;cursor:pointer;transition:all .15s;outline:none;letter-spacing:.01em}

/* === HEADER === */
.hdr{padding:18px 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd);flex-wrap:wrap;gap:14px;background:var(--bgc)}
.brand{display:flex;align-items:center;gap:16px}
.brand-mark{height:38px;width:auto;display:block}
.brand-divider{width:1px;height:32px;background:var(--bd)}
.brand-txt{display:flex;flex-direction:column;line-height:1.1}
.brand-name{font-size:14px;font-weight:800;letter-spacing:-.01em;text-transform:uppercase}
.brand-sub{font-size:9px;font-weight:500;color:var(--txm);letter-spacing:.18em;text-transform:uppercase;margin-top:3px}
.ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* === BUTTONS === */
.btn{padding:8px 14px;font-size:11px;font-weight:600;border:1px solid var(--bd);background:transparent;color:var(--tx);text-transform:uppercase;letter-spacing:.06em;border-radius:2px}
.btn:hover{border-color:var(--bdH);background:var(--bg2)}
.btn.on{border-color:var(--ac);background:var(--ac);color:#fff;font-weight:700}
.btn-sm{padding:6px 11px;font-size:10px}
.btn-xs{padding:4px 9px;font-size:9px}
.btn-primary{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
.btn-primary:hover{background:var(--acH);border-color:var(--acH);color:#fff}
.btn-icon{display:inline-flex;align-items:center;gap:6px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:2px;overflow:hidden}
.seg .btn{border:none;border-right:1px solid var(--bd);border-radius:0}
.seg .btn:last-child{border-right:none}
.seg .btn.on{border-color:var(--ac)}

/* === STATUS === */
.status-bar{padding:6px 32px;font-size:10px;background:var(--bgc);border-bottom:1px solid var(--bd);color:var(--txm);text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:8px}
.status-bar::before{content:"";width:6px;height:6px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e}

/* === TABS === */
.tabs{padding:0 32px;border-bottom:1px solid var(--bd);display:flex;background:var(--bgc)}
.tab{padding:14px 22px;font-size:11px;font-weight:600;background:transparent;border:none;color:var(--txm);border-bottom:2px solid transparent;text-transform:uppercase;letter-spacing:.1em}
.tab:hover{color:var(--tx)}
.tab.on{color:var(--tx);border-bottom-color:var(--ac)}

/* === BAR / FILTERS === */
.bar{padding:16px 32px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;background:var(--bg);border-bottom:1px solid var(--bd)}
.bar-l,.bar-r{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bar-label{font-size:9px;color:var(--txm);text-transform:uppercase;letter-spacing:.12em;font-weight:600;margin-right:4px}

/* === CONTENT === */
.content{padding:24px 32px}

/* === TABLE === */
.tbl-wrap{overflow-x:auto;border:1px solid var(--bd);background:var(--bgc)}
table{width:100%;border-collapse:collapse;font-size:12px}
thead tr{background:var(--bg2);border-bottom:1px solid var(--bd)}
th{padding:12px 14px;font-size:9px;font-weight:700;color:var(--txm);text-transform:uppercase;letter-spacing:.12em;border-bottom:1px solid var(--bd)}
th:first-child{text-align:left;position:sticky;left:0;background:var(--bg2);z-index:2;min-width:280px;border-right:1px solid var(--bd)}
th:not(:first-child){text-align:right}
td{padding:11px 14px;text-align:right;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--bd);font-family:var(--num);font-size:12px;font-weight:500;color:var(--txd)}
td:first-child{position:sticky;left:0;background:var(--bgc);z-index:1;text-align:left;font-family:'Inter',sans-serif;border-right:1px solid var(--bd)}
tbody tr:hover td{background:var(--bg2)}
tbody tr:hover td:first-child{background:var(--bg3)}
tbody tr:last-child td{border-bottom:none}
.ent{display:flex;align-items:center;gap:10px}
.rank{font-size:10px;color:var(--txm);width:22px;text-align:right;font-weight:700;font-family:var(--num)}
.cbar{width:3px;height:24px;flex-shrink:0}
.flag{font-size:14px;display:flex;align-items:center}
.ename{font-weight:600;font-size:12px;white-space:nowrap;color:var(--tx);letter-spacing:-.005em}
.badge{display:inline-block;font-size:8px;font-weight:700;padding:3px 7px;color:#fff;margin-left:6px;text-transform:uppercase;letter-spacing:.08em;border-radius:1px}
.empty{color:var(--bd)}

/* === CHART === */
.chart-box{background:var(--bgc);border:1px solid var(--bd);padding:24px}
.chart-title{font-size:11px;font-weight:700;margin-bottom:20px;text-transform:uppercase;letter-spacing:.12em;color:var(--txm);display:flex;align-items:center;gap:10px}
.chart-title::before{content:"";width:3px;height:14px;background:var(--ac)}
.chart-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.chart-name{font-size:11px;width:180px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--tx)}
.chart-track{flex:1;height:26px;background:var(--bg2);overflow:hidden;border:1px solid var(--bd)}
.chart-fill{height:100%;display:flex;align-items:center;justify-content:flex-end;padding-right:10px;transition:width .8s cubic-bezier(.16,1,.3,1)}
.chart-val{font-size:10px;font-weight:700;color:#fff;font-family:var(--num);text-shadow:0 1px 2px rgba(0,0,0,.6)}
.chart-val-out{font-size:10px;color:var(--txd);font-weight:700;font-family:var(--num);margin-left:4px}

/* === LEGEND === */
.legend{margin-top:16px;padding:14px 18px;border:1px solid var(--bd);background:var(--bgc);font-size:9px;color:var(--txm);display:flex;flex-wrap:wrap;gap:18px;align-items:center;text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.leg-i{display:flex;align-items:center;gap:6px}
.leg-d{width:10px;height:10px;display:inline-block}

/* === IMPORT ZONE === */
.import-zone{border:1px dashed var(--bd);padding:48px 24px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:20px;background:var(--bgc)}
.import-zone:hover{border-color:var(--ac);background:var(--bg2)}
.import-zone-icon{width:48px;height:48px;margin:0 auto 14px;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--ac)}
.import-zone-title{font-size:13px;font-weight:700;margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em}
.import-zone-sub{font-size:10px;color:var(--txm);letter-spacing:.04em}

/* === MODAL === */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.75);z-index:100;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.modal{background:var(--bgc);border:1px solid var(--bd);padding:32px;width:460px;max-width:92vw;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal-title{font-size:14px;font-weight:800;margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:10px}
.modal-title::before{content:"";width:3px;height:16px;background:var(--ac)}
.modal-sub{font-size:11px;color:var(--txm);margin-bottom:24px;line-height:1.5}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal-btn{display:flex;align-items:center;gap:12px;padding:16px 14px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;flex-wrap:wrap;text-transform:uppercase;letter-spacing:.05em}
.modal-btn-date{width:100%;font-size:9px;font-weight:500;margin-top:4px;text-transform:none;letter-spacing:0;font-family:var(--num)}
.modal-btn:hover:not(:disabled){border-color:var(--ac);background:var(--bg3)}
.modal-btn:disabled{opacity:.4;cursor:not-allowed}
.modal-btn .mbico{width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-close{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--txm);font-size:18px;cursor:pointer;padding:6px 10px;line-height:1}
.modal-close:hover{color:var(--tx)}
.modal-status{margin-top:18px;padding:14px;font-size:10px;line-height:1.7;max-height:200px;overflow-y:auto;background:var(--bg);border:1px solid var(--bd);display:none;font-family:var(--num)}
.modal-status.show{display:block}
.modal-progress{width:100%;height:2px;background:var(--bd);margin-top:14px;overflow:hidden;display:none}
.modal-progress.show{display:block}
.modal-progress-bar{height:100%;background:var(--ac);transition:width .3s;width:0}
.modal input{font-family:var(--num)}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.collecting{animation:pulse 1.5s infinite}

/* === SCROLLBAR === */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bd);border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--bdH)}
</style>
</head>

<div id="modal-container"></div>

function fN(n){return n==null?"—":n.toLocaleString("fr-FR")}
function gVal(md,s){
  if(!md)return null;
  if(s==="Overall"){const t=(md.ig||0)+(md.fb||0)+(md.x||0)+(md.tk||0);return t>0?t:null}
  const mp={Instagram:"ig",Facebook:"fb",X:"x",TikTok:"tk"};
  return md[mp[s]]||null;
}

// ═══ STATE ═══
let S={gen:"men",tab:"courses",soc:"Overall",vw:"table",fil:"all",dt:{},lastImport:null};

function loadFromLS(){
  try{const d=localStorage.getItem("uci-dash-v2");if(d)S.dt=JSON.parse(d)}catch{}
  try{const li=localStorage.getItem("uci-dash-lastimport");if(li)S.lastImport=li}catch{}
}
function saveToLS(){
  try{localStorage.setItem("uci-dash-v2",JSON.stringify(S.dt))}catch{}
  try{if(S.lastImport)localStorage.setItem("uci-dash-lastimport",S.lastImport)}catch{}
}

function getItems(){
  const src=S.tab==="courses"?(S.gen==="men"?RM:RW):(S.gen==="men"?TM:TW);
  let ls=src.map(e=>({...e,_k:e.n+"|"+(e.cl||e.co),_m:S.dt[e.n+"|"+(e.cl||e.co)]||{}}));
  if(S.tab==="courses"){
    if(S.fil==="gt")ls=ls.filter(r=>rbdg(r.n,r.cl).l==="Grand Tour");
    if(S.fil==="stage")ls=ls.filter(r=>r.cl&&r.cl.startsWith("2."));
    if(S.fil==="oneday")ls=ls.filter(r=>r.cl&&r.cl.startsWith("1."));
  }
  ls.sort((a,b)=>{for(const mk of MKS){const va=gVal(a._m[mk],S.soc)||0,vb=gVal(b._m[mk],S.soc)||0;if(va||vb)return vb-va}return 0});
  return ls;
}

function getCM(items){
  if(S.tab==="equipes")return S.gen==="men"?TCM:TCW;
  const m={};items.forEach(r=>m[r.n]=rcol(r.n,r.cl));return m;
}

    h+=`<div class="chart-box"><div class="chart-title">Classement Top 10 — ${S.soc} — Saison 2026</div>`;
    if(vals.every(v=>v.v===0)){
      h+=`<div style="color:var(--txm);font-size:12px;padding:30px;text-align:center">Aucune donnée. Cliquez sur "Importer Excel" pour charger les fichiers.</div>`;
    } else {
      vals.forEach(v=>{
        const pct=(v.v/mx*100);
        h+=`<div class="chart-row"><span class="chart-name">${v.n}</span><div class="chart-track"><div class="chart-fill" style="width:${pct}%;background:${v.c}">${v.v>mx*.15?`<span class="chart-val">${fN(v.v)}</span>`:""}</div></div>${v.v<=mx*.15?`<span class="chart-val-out">${fN(v.v)}</span>`:""}</div>`;
      });
    }
    h+=`</div>`;
  }

  h+=`</div>`;
  app.innerHTML=h;

}

// ═══ EXCEL IMPORT ═══
// Uses SheetJS (loaded from CDN) to parse the 2 xlsx files produced by
// scripts/scrape_to_excel.py, then merges into S.dt.

const MOIS_MAP={
  "janvier":"jan","fevrier":"feb","février":"feb","mars":"mar","avril":"apr",
  "mai":"may","juin":"jun","juillet":"jul","aout":"aug","août":"aug",
  "septembre":"sep","octobre":"oct","novembre":"nov","decembre":"dec","décembre":"dec"
};
function parseMonthHeader(h){
  if(!h||typeof h!=="string")return null;
  // "Avril 2026" → "apr"
  const parts=h.toLowerCase().trim().split(/\s+/);
  const mk=MOIS_MAP[parts[0]];
  return mk||null;
}

function normName(s){
  return String(s||"").toLowerCase().replace(/[\u00C0-\u017F]/g,c=>({"à":"a","â":"a","é":"e","è":"e","ê":"e","ë":"e","î":"i","ï":"i","ô":"o","ö":"o","ù":"u","û":"u","ç":"c","ñ":"n"})[c]||c).replace(/[^a-z0-9]/g,"");
}

function findEntityKey(name, classe, list){
  const nn=normName(name);
  for(const e of list){
    if(normName(e.n)===nn){
      return e.n+"|"+(e.cl||e.co);
    }
  }
  return null;
}

function parseSheetIntoDt(ws, entityList){
  // ws is a SheetJS worksheet
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
  if(rows.length<2)return 0;
  const header=rows[0];
  // Expected: [Nom, Pays/Classe, Réseau, <Mois1>, <Mois2>, ...]
  // Find column positions
  const nameCol=0, classCol=1, netCol=2;
  const monthCols=[]; // [(colIndex, monthKey)]
  for(let c=3;c<header.length;c++){
    const mk=parseMonthHeader(header[c]);
    if(mk) monthCols.push([c,mk]);
  }
  if(monthCols.length===0)return 0;

  let imported=0;
  for(let r=1;r<rows.length;r++){
    const row=rows[r];
    const name=row[nameCol];
    const net=row[netCol];
    if(!name||!net)continue;
    const netKey=({Instagram:"ig",Facebook:"fb","X (Twitter)":"x",X:"x",TikTok:"tk"})[String(net).trim()];
    if(!netKey)continue;
    const key=findEntityKey(name, row[classCol], entityList);
    if(!key)continue;
    if(!S.dt[key])S.dt[key]={};
    for(const [cIdx,mk] of monthCols){
      const v=row[cIdx];
      if(v===null||v===undefined||v==="")continue;
      const n=typeof v==="number"?v:parseInt(String(v).replace(/[^\d]/g,""),10);
      if(!isNaN(n)&&n>0){
        if(!S.dt[key][mk])S.dt[key][mk]={};
        S.dt[key][mk][netKey]=n;
        imported++;
      }
    }
  }
  return imported;
}

async function handleExcelFiles(fileList){
  if(!fileList||fileList.length===0)return;
  const logEl=document.getElementById("import-log");
  const log=(msg,cls="")=>{
    if(logEl){const div=document.createElement("div");div.textContent=msg;if(cls)div.style.color=cls;logEl.appendChild(div);logEl.scrollTop=logEl.scrollHeight}
  };
  if(typeof XLSX==="undefined"){
    log("❌ SheetJS non chargé — vérifiez votre connexion Internet","#ef4444");
    return;
  }

  let totalImported=0, filesProcessed=0;
  for(const file of fileList){
    log(`📄 Lecture de ${file.name}...`);
    try{
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(buf,{type:"array"});
      const fileLower=file.name.toLowerCase();
      const isEquipes=fileLower.includes("equipe")||fileLower.includes("équipe")||fileLower.includes("team");
      const isCourses=fileLower.includes("course")||fileLower.includes("race");
      const guessSheets=wb.SheetNames;

      for(const sn of guessSheets){
        const snLower=sn.toLowerCase();
        const isHommes=snLower.includes("homme")||snLower.includes("men");
        const isFemmes=snLower.includes("femme")||snLower.includes("women");
        let targetList=null;
        if(isEquipes && isHommes) targetList=TM;
        else if(isEquipes && isFemmes) targetList=TW;
        else if(isCourses && isHommes) targetList=RM;
        else if(isCourses && isFemmes) targetList=RW;
        if(!targetList){
          log(`  ⚠️  feuille "${sn}" ignorée`,"#f59e0b");
          continue;
        }
        const n=parseSheetIntoDt(wb.Sheets[sn], targetList);
        log(`  ✅ ${sn} → ${n} valeurs importées`,"#22c55e");
        totalImported+=n;
      }
      filesProcessed++;
    }catch(err){
      log(`  ❌ Erreur : ${err.message}`,"#ef4444");
    }
  }

  if(totalImported>0){
    S.lastImport=new Date().toISOString().split("T")[0];
    saveToLS();
    render();
    log(`🏁 Import terminé : ${totalImported} valeurs depuis ${filesProcessed} fichier(s)`,"#22c55e");
  }else{
    log("⚠️ Aucune donnée importée — vérifiez le format des fichiers","#f59e0b");
  }
}
